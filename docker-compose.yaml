services:
  repo:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: respiratory-disease-detection

    runtime: nvidia

    environment:
      - NVIDIA_VISIBLE_DEVICES=all

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    shm_size: "1gb"

    ulimits:
      memlock:
        soft: -1
        hard: -1

    stdin_open: true
    tty: true